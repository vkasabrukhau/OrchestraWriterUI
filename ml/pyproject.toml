[project]
name = "orchestra-transcriber"
version = "0.1.0"
description = "Local audio-to-score service for the Orchestra Visualizer (MuScriptor + music21)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # MIT code; the model WEIGHTS are CC BY-NC 4.0 (non-commercial) and gated on
    # Hugging Face: accept the licence and run `uvx hf auth login` first.
    "muscriptor>=0.4",
    # BSD-3: quantized MIDI -> MusicXML.
    "music21>=9.1",
]

[tool.uv]
package = false
# torchaudio's newest release (2.11) is built against torch 2.11's CUDA (13.0).
# On Linux with a GPU it refuses to load next to a newer torch ("compiled with
# different CUDA versions"), so keep torch at 2.11 there (the AWS instance,
# ADR 0014). macOS wheels have no CUDA and keep the newest torch.
constraint-dependencies = ["torch==2.11.*; sys_platform == 'linux'"]
