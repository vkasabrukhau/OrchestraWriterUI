name: CI and deploy

on:
  push:
    branches: [main]
    # Docs-only pushes do not need a new image. PRs still run the typecheck.
    paths-ignore:
      - "docs/**"
      - "infra/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job request a GitHub OIDC token, which AWS exchanges for
  # short-lived credentials for the deploy role. No AWS keys are stored.
  id-token: write

env:
  AWS_REGION: us-east-1
  APP_NAME: orchestra-writer

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Build image and deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.rollout.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.APP_NAME }}
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          echo "pushed_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Wait for App Runner rollout
        id: rollout
        env:
          PUSHED_AT: ${{ steps.build.outputs.pushed_at }}
        run: |
          # App Runner watches the :latest tag and starts a deployment on its own.
          # Wait for that deployment (the newest operation started after the push)
          # to finish. A deployment that fails its health check rolls back and
          # leaves the service RUNNING on the old image, so the service status
          # alone would report success; the operation status is what counts.
          ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='${APP_NAME}'].ServiceArn" --output text)
          if [ -z "$ARN" ]; then
            echo "::notice::Image pushed. No App Runner service named ${APP_NAME} yet; scripts/deploy-init.sh creates it from this image."
            exit 0
          fi
          for i in $(seq 1 80); do
            read -r OP_STATUS OP_STARTED <<<"$(aws apprunner list-operations --service-arn "$ARN" --max-results 1 \
              --query 'OperationSummaryList[0].[Status,StartedAt]' --output text)"
            STARTED=$(date -d "$OP_STARTED" +%s 2>/dev/null || echo 0)
            if [ "$STARTED" -ge "$PUSHED_AT" ]; then
              echo "[$i] $OP_STATUS"
              case "$OP_STATUS" in
                SUCCEEDED) break ;;
                FAILED|ROLLBACK_*)
                  echo "::error::App Runner deployment ended $OP_STATUS; the service is still on the previous image. Logs: aws logs tail /aws/apprunner/${APP_NAME}/$(basename "$ARN")/application --since 30m"
                  exit 1 ;;
              esac
            else
              echo "[$i] waiting for App Runner to start the deployment"
            fi
            if [ "$i" -eq 80 ]; then echo "::error::Timed out after 20 minutes waiting for the App Runner deployment."; exit 1; fi
            sleep 15
          done
          URL=$(aws apprunner describe-service --service-arn "$ARN" --query Service.ServiceUrl --output text)
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: https://$URL"

  # The Lambda pipeline (Dockerfile.worker, scripts/pipeline-init.sh) is no
  # longer built here: it has no UI, still runs a placeholder model, and its
  # Dockerfile expects the old repo's server/ layout. The six functions keep
  # the image they last had. See infra/README.md, "Transcription pipeline".
